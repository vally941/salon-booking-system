{% extends "base.html" %}

{% block title %}Login - Vally's Divine Hair{% endblock %}

{% block content %}
<div class="auth-container">
    <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required 
                   placeholder="Enter your email">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required 
                   placeholder="Enter your password">
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; margin: 15px 0;">
            <input type="checkbox" id="remember" name="remember" style="width: auto; margin-right: 10px;">
            <label for="remember" style="margin: 0;">Remember me</label>
        </div>
        
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
    </form>
    
    <div style="margin-top: 20px; text-align: center;">
        <p>Don't have an account? 
            <a href="{{ url_for('register') }}" style="color: #ff69b4; font-weight: bold;">
                Register here
            </a>
        </p>
        <p style="margin-top: 10px;">
            <a href="{{ url_for('home') }}" style="color: #666;">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </p>
    </div>
</div>
{% endblock %}
